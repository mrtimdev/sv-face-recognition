; Keeps every part running: whatever stops, for whatever reason, is started again.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/sv-supervisord.pid

[unix_http_server]
file=/tmp/sv-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/sv-supervisor.sock

[program:screen]
command=/bin/sh -c 'exec Xvfb :99 -screen 0 %(ENV_SCREEN_SIZE)sx24 -nolisten tcp'
priority=10
autorestart=true
startretries=1000000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:windows]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.5; done; exec openbox --config-file /opt/sv-stream/openbox-rc.xml'
priority=20
autorestart=true
startretries=1000000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=/opt/sv-stream/run-vnc.sh
priority=30
autorestart=true
startretries=1000000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=40
autorestart=true
startretries=1000000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
command=/opt/sv-stream/run-app.sh
priority=50
autorestart=true
startsecs=10
startretries=1000000
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
