name: Build & Release

on:
  # Build a Windows installer from the selected branch without publishing a release.
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build app bundle
        run: |
          source venv/bin/activate
          pyinstaller build.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname 'SV Face ID' \
            -srcfolder 'dist/SV Face ID.app' \
            -ov -format UDZO \
            "dist/SV-Face-ID-${GITHUB_REF_NAME}-mac.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/SV-Face-ID-*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build executable
        run: |
          .\venv\Scripts\Activate.ps1
          pyinstaller build.spec --noconfirm

      - name: Create installer
        run: |
          choco install innosetup -y --no-progress
          iscc scripts\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/SV-Face-ID-Setup-*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe
