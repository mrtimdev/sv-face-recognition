name: Build & Release

on:
  # Build both installers from the selected ref without publishing a release.
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build-macos:
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install -r requirements.txt pyinstaller Pillow
          venv/bin/python -m pip check

      - name: Stamp version from tag
        # face_attendance/version.py feeds the app, Info.plist and the updater.
        if: github.ref_type == 'tag'
        run: python scripts/set_version.py "$GITHUB_REF_NAME"

      - name: Build app bundle
        run: |
          venv/bin/python -m PyInstaller build.spec --noconfirm --clean

      - name: Create DMG
        run: |
          VERSION="$(venv/bin/python scripts/set_version.py)"
          test -x 'dist/SV Face ID.app/Contents/MacOS/SV Face ID'
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/SV Face ID.app/Contents/Info.plist')"
          test "$BUNDLE_VERSION" = "$VERSION"
          hdiutil create -volname 'SV Face ID' \
            -srcfolder 'dist/SV Face ID.app' \
            -ov -format UDZO \
            "dist/SV-Face-ID-v${VERSION}-mac.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: frontend/dist/SV-Face-ID-*.dmg
          if-no-files-found: error

  build-windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m venv venv
          if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed" }
          & .\venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller Pillow
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          & .\venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency verification failed" }

      - name: Stamp version from tag
        # Manual (workflow_dispatch) builds keep the committed version.
        if: github.ref_type == 'tag'
        run: |
          & .\venv\Scripts\python.exe scripts/set_version.py "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Version stamping failed" }

      - name: Build executable
        run: |
          & .\venv\Scripts\python.exe -m PyInstaller build.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { throw "Executable build failed" }
          if (-not (Test-Path 'dist\SV Face ID\SV Face ID.exe')) { throw "Packaged executable is missing" }

      - name: Create installer
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { throw "Inno Setup installation failed" }
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          $version = & .\venv\Scripts\python.exe scripts/set_version.py
          if ($LASTEXITCODE -ne 0) { throw "Could not read installer version" }
          Write-Host "Installer version: $version"
          & $iscc "/DMyAppVersion=$version" scripts\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: frontend/dist/SV-Face-ID-Setup-*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload both installers to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe

      - name: Verify installers and publish release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const {data: release} = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag
            });
            for (const name of [`SV-Face-ID-${tag}-mac.dmg`, `SV-Face-ID-Setup-${version}.exe`]) {
              const asset = release.assets.find(item => item.name === name);
              if (!asset || asset.state !== 'uploaded' || asset.size <= 0) {
                throw new Error(`Required installer is missing or incomplete: ${name}`);
              }
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false, make_latest: 'true'
            });
